<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tactical Neon</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0f;
        --text: #ffffff;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: #0d0d0f;
        color: var(--text);
        font-family: monospace;
        overflow: hidden;
        box-sizing: border-box;
      }

      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        box-sizing: border-box;
      }

      canvas {
        display: block;
        margin: 0 auto;
        max-width: none;
        max-height: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
