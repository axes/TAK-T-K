<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tactical Neon</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0d0f;
        --text: #ffffff;
      }

      html {
        width: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background: #08080a;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background: #08080a;
        color: var(--text);
        font-family: monospace;
        overflow: auto;
        box-sizing: border-box;
      }

      #game-container {
        width: 100%;
        min-width: 1440px;
        min-height: 810px;
        height: 100vh;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-container canvas {
        display: block;
        margin: 0;
        width: 1440px;
        height: 810px;
        flex: 0 0 auto;
        padding: 0;
        transform: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
