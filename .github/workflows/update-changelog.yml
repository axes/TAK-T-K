name: Validate Changelog

on:
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate changelog structure
        run: |
          test -s taktk-client/CHANGELOG.md
          grep -q '^## \[Unreleased\]$' taktk-client/CHANGELOG.md
